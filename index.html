<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Glass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="glass">
    <header class="glass__head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l7 4v5c0 4.4-3 8.2-7 9-4-.8-7-4.6-7-9V7l7-4z" />
          <path d="M9.5 12.2l1.8 1.8 3.4-3.6" />
        </svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to continue to your account</p>
    </header>

    <form id="login" class="glass__form" novalidate>
      <label class="field">
        <span class="field__label">Email</span>
        <span class="field__control">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="3" />
            <path d="M4 7.5l8 5.5 8-5.5" />
          </svg>
          <input id="email" type="email" name="email" placeholder="you@example.com"
                 autocomplete="email" required />
        </span>
      </label>

      <label class="field">
        <span class="field__label">Password</span>
        <span class="field__control">
          <svg class="field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10" width="16" height="10" rx="2.5" />
            <path d="M8 10V7.5a4 4 0 018 0V10" />
          </svg>
          <input id="password" type="password" name="password" placeholder="••••••••"
                 autocomplete="current-password" required />
          <button class="reveal" type="button" id="reveal" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" />
              <circle cx="12" cy="12" r="2.8" />
            </svg>
          </button>
        </span>
      </label>

      <div class="row">
        <label class="check">
          <input type="checkbox" name="remember" />
          <span class="check__box" aria-hidden="true"></span>
          <span>Remember me</span>
        </label>
        <a class="link" href="#">Forgot password?</a>
      </div>

      <button class="submit" type="submit">Sign in</button>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <div class="divider"><span>or continue with</span></div>

      <div class="socials">
        <button type="button" class="social">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21.6 12.2c0-.7-.06-1.36-.18-2H12v3.79h5.38a4.6 4.6 0 01-2 3.02v2.5h3.23c1.89-1.74 2.99-4.3 2.99-7.31z"/>
            <path fill="currentColor" d="M12 22c2.7 0 4.96-.9 6.61-2.43l-3.23-2.5c-.9.6-2.05.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.58A10 10 0 0012 22z"/>
            <path fill="currentColor" d="M6.41 13.91a6 6 0 010-3.82V7.51H3.07a10 10 0 000 8.98l3.34-2.58z"/>
            <path fill="currentColor" d="M12 5.98c1.47 0 2.79.5 3.83 1.5l2.86-2.86A9.6 9.6 0 0012 2a10 10 0 00-8.93 5.51l3.34 2.58C7.2 7.73 9.4 5.98 12 5.98z"/>
          </svg>
          Google
        </button>
        <button type="button" class="social">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2a10 10 0 00-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 015 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0012 2z"/>
          </svg>
          GitHub
        </button>
      </div>

      <p class="foot">Don't have an account? <a class="link" href="#">Create one</a></p>
    </form>
  </main>
</body>
</html>
